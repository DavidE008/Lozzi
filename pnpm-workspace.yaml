packages:
  - apps/*
  - packages/*

overrides:
  "@hono/node-server@<2.0.10": 2.0.10
  axios@<1.18.1: 1.18.1
  postcss@<=8.5.17: 8.5.18
  sharp@<0.35.0: 0.35.0
  tmp@<0.2.7: 0.2.7
  ws@<8.21.0: 8.21.0

allowBuilds:
  bufferutil: false
  es5-ext: false
  keccak: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - "@hookform/resolvers@5.4.1"
  - "@playwright/test@1.62.0"
  - eslint@9.39.2
  - playwright-core@1.62.0
  - playwright@1.62.0
  - react-hook-form@7.83.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
