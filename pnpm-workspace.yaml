packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.4.1'
  - '@playwright/test@1.62.0'
  - eslint@10.8.0
  - playwright-core@1.62.0
  - playwright@1.62.0
  - react-hook-form@7.83.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
